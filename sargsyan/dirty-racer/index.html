<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141b19">
  <meta name="description" content="Build your rally team. Upgrade your cars. Watch every stage in 3D. Play Dirty Racer in your browser.">
  <title>Dirty Racer · Rally Team</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#edf0e8; background:#141b19; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { background:radial-gradient(ellipse at 50% 30%,#2b3930 0%,#141b19 70%); }
    #shell { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); gap:8px; }
    header { width:min(100%,640px); height:32px; flex:none; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:12px; font-weight:850; letter-spacing:2px; }
    .brand span { color:#b7d873; }
    button { border:1px solid #ffffff29; border-radius:6px; background:#ffffff09; color:#edf0e8; font:inherit; font-size:11px; cursor:pointer; padding:6px 9px; }
    button:hover { background:#ffffff18; }
    button:focus-visible { outline:2px solid #b7d873; outline-offset:3px; }
    #play-area { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:center; }
    #game { position:relative; height:100%; aspect-ratio:6/13; max-width:100%; overflow:hidden; background:#18231d; box-shadow:0 16px 80px #0007; border-radius:7px; }
    canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:32px; gap:18px; background:#18231d; }
    #loading[hidden] { display:none; }
    .tag { color:#b7d873; letter-spacing:3px; font-size:10px; font-weight:700; }
    h1 { font-size:clamp(32px,6vw,48px); line-height:.95; letter-spacing:-2px; margin:0; font-weight:900; }
    .track { height:42px; width:74px; border:3px solid #b7d873; border-left-color:transparent; border-radius:50% 35% 50% 30%; transform:rotate(-25deg); margin:0 0 16px 4px; }
    #load-label { display:flex; justify-content:space-between; color:#aab6aa; font-size:12px; gap:8px; }
    progress { display:block; appearance:none; width:100%; height:4px; border:0; border-radius:4px; overflow:hidden; background:#ffffff16; }
    progress::-webkit-progress-bar { background:#ffffff16; }
    progress::-webkit-progress-value { background:#b7d873; transition:width .15s; }
    progress::-moz-progress-bar { background:#b7d873; }
    #error { margin:0; font-size:12px; color:#ffb6a2; line-height:1.5; overflow-wrap:anywhere; }
    #retry { align-self:flex-start; }
    footer { color:#94a393; font-size:10px; text-align:center; flex:none; }
    #shell:fullscreen { background:#141b19; }
    @media(max-width:480px) { #shell { gap:4px; padding-left:0; padding-right:0; } header { padding:0 12px; height:28px; } #game { border-radius:0; box-shadow:none; } footer { font-size:9px; } }
  </style>
</head>
<body>
  <main id="shell">
    <header><div class="brand">DIRTY <span>RACER</span></div><button id="fullscreen" type="button" aria-label="Toggle fullscreen">↗</button></header>
    <div id="play-area">
      <div id="game">
        <canvas id="unity-canvas" width="540" height="1170" tabindex="0" aria-label="Dirty Racer rally team game"></canvas>
        <div id="loading" role="status" aria-live="polite">
          <div class="track" aria-hidden="true"></div>
          <h1>DIRTY<br>RACER.</h1>
          <div id="load-label"><span id="load-text"></span><span id="percent">0%</span></div>
          <progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress>
          <p id="error" hidden></p>
          <button id="retry" type="button" hidden>Reload</button>
        </div>
      </div>
    </div>
  </main>
  <noscript>Enable JavaScript to play Dirty Racer.</noscript>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const game = document.getElementById('game');
    const area = document.getElementById('play-area');
    function fitGame() {
      const width = Math.min(area.clientWidth, area.clientHeight * 6 / 13);
      game.style.width = width + 'px';
      game.style.height = width * 13 / 6 + 'px';
    }
    new ResizeObserver(fitGame).observe(area);
    fitGame();
    function showError(message) {
      console.error('[Dirty Racer]', message);
      loading.hidden = false;
      document.getElementById('load-text').textContent = 'Could not start the game';
      const error = document.getElementById('error');
      error.textContent = String(message);
      error.hidden = false;
      document.getElementById('retry').hidden = false;
    }
    document.getElementById('retry').onclick = () => location.reload();
    document.getElementById('fullscreen').onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.getElementById('shell').requestFullscreen) await document.getElementById('shell').requestFullscreen();
      } catch (error) { console.warn('Fullscreen unavailable:', error.message); }
    };
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll:true}));
    canvas.addEventListener('wheel', event => event.preventDefault(), {passive:false});
    const config = {
      arguments: [],
      dataUrl: 'Build/06d88d0c2726869cfce8855b23df92ad.data.unityweb',
      frameworkUrl: 'Build/7fab013521c0c9de9cd99430fc29b3cf.framework.js.unityweb',
      codeUrl: 'Build/5741f5f8457068405b3d9af92c5d79dd.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Dirty Racer Team",
      productName: "Dirty Racer",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => {
        if (type === 'error') showError(message);
        else console.warn(message);
      }
    };
    function notifyVisibility(hidden) {
      if (window.unityInstance) window.unityInstance.SendMessage('GameRoot', 'BrowserVisibility', hidden ? '1' : '0');
    }
    document.addEventListener('visibilitychange', () => notifyVisibility(document.hidden));
    window.addEventListener('pagehide', () => notifyVisibility(true));
    window.addEventListener('pageshow', () => notifyVisibility(document.hidden));
    const loader = document.createElement('script');
    loader.src = 'Build/ff4b82714a7049616c8a9758aec8327d.loader.js';
    loader.onerror = () => showError('The game download failed. Check your connection and reload.');
    loader.onload = () => {
      createUnityInstance(canvas, config, value => {
        progress.value = value;
        percent.textContent = Math.round(value * 100) + '%';
        if (value >= 0.9) document.getElementById('load-text').textContent = '';
      }).then(instance => {
        window.unityInstance = instance;
        loading.hidden = true;
        canvas.focus({preventScroll:true});
        notifyVisibility(document.hidden);
      }).catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
