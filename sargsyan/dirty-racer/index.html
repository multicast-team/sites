<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9e0d1">
  <meta name="description" content="Build your rally team. Upgrade your cars. Watch every stage in 3D. Play Dirty Racer in your browser.">
  <title>Dirty Racer · Rally Team</title>
  <style>
    :root { color-scheme:light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#292a28; background:#e9e0d1; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { background:#e9e0d1; }
    #shell { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); gap:8px; }
    header { width:min(100%,640px); height:32px; flex:none; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:12px; font-weight:850; letter-spacing:2px; }
    .brand span { color:#b8461b; }
    button { border:1px solid #ffffff29; border-radius:6px; background:#ffffff09; color:#292a28; font:inherit; font-size:11px; cursor:pointer; padding:6px 9px; }
    button:hover { background:#ffffff18; }
    button:focus-visible { outline:2px solid #b8461b; outline-offset:3px; }
    #play-area { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:center; }
    #game { position:relative; height:100%; aspect-ratio:6/13; max-width:100%; overflow:hidden; background:#f4efe5; box-shadow:0 16px 80px #172b4d18; border-radius:7px; }
    canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:32px; gap:18px; background:#f4efe5; }
    #loading[hidden] { display:none; }
    .tag { color:#b8461b; letter-spacing:3px; font-size:10px; font-weight:700; }
    h1 { font-size:clamp(32px,6vw,48px); line-height:.95; letter-spacing:-2px; margin:0; font-weight:900; }
    .track { height:42px; width:74px; border:3px solid #b8461b; border-left-color:transparent; border-radius:50% 35% 50% 30%; transform:rotate(-25deg); margin:0 0 16px 4px; }
    #load-label { display:flex; justify-content:space-between; color:#655f55; font-size:12px; gap:8px; }
    progress { display:block; appearance:none; width:100%; height:4px; border:0; border-radius:4px; overflow:hidden; background:#d9cdba; }
    progress::-webkit-progress-bar { background:#d9cdba; }
    progress::-webkit-progress-value { background:#b8461b; transition:width .15s; }
    progress::-moz-progress-bar { background:#b8461b; }
    #error { margin:0; font-size:12px; color:#b92436; line-height:1.5; overflow-wrap:anywhere; }
    #retry { align-self:flex-start; }
    footer { color:#6f665a; font-size:10px; text-align:center; flex:none; }
    #shell:fullscreen { background:#e9e0d1; }
    @media(max-width:480px) { #shell { gap:4px; padding-left:0; padding-right:0; } header { padding:0 12px; height:28px; } #game { border-radius:0; box-shadow:none; } footer { font-size:9px; } }
    @media(max-width:620px){#shell{padding:0;gap:0}header{display:none}#game{border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main id="shell">
    <header><div class="brand">DIRTY <span>RACER</span></div><button id="fullscreen" type="button" aria-label="Toggle fullscreen">↗</button></header>
    <div id="play-area">
      <div id="game">
        <canvas id="unity-canvas" width="540" height="1170" tabindex="0" aria-label="Dirty Racer rally team game"></canvas>
        <div id="loading" role="status" aria-live="polite">
          <div class="track" aria-hidden="true"></div>
          <h1>DIRTY<br>RACER.</h1>
          <div id="load-label"><span id="load-text"></span><span id="percent">0%</span></div>
          <progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress>
          <p id="error" hidden></p>
          <button id="retry" type="button" hidden>Reload</button>
        </div>
      </div>
    </div>
  </main>
  <noscript>Enable JavaScript to play Dirty Racer.</noscript>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const game = document.getElementById('game');
    const area = document.getElementById('play-area');
    function fitGame() {
      const width = Math.min(area.clientWidth, area.clientHeight * 6 / 13);
      game.style.width = width + 'px';
      game.style.height = width * 13 / 6 + 'px';
    }
    new ResizeObserver(fitGame).observe(area);
    fitGame();
    function showError(message) {
      console.error('[Dirty Racer]', message);
      loading.hidden = false;
      document.getElementById('load-text').textContent = 'Could not start the game';
      const error = document.getElementById('error');
      error.textContent = String(message);
      error.hidden = false;
      document.getElementById('retry').hidden = false;
    }
    document.getElementById('retry').onclick = () => location.reload();
    document.getElementById('fullscreen').onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.getElementById('shell').requestFullscreen) await document.getElementById('shell').requestFullscreen();
      } catch (error) { console.warn('Fullscreen unavailable:', error.message); }
    };
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll:true}));
    canvas.addEventListener('wheel', event => event.preventDefault(), {passive:false});
    const config = {
      arguments: [],
      dataUrl: 'Build/4b2e9f4d2c44783ba5a7506955a69a0d.data.unityweb',
      frameworkUrl: 'Build/c393ef226495e725ceccbcd36f860e50.framework.js.unityweb',
      codeUrl: 'Build/6842a1758051dfbef9432443795b7395.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Dirty Racer Team",
      productName: "Dirty Racer",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => {
        if (type === 'error') showError(message);
        else console.warn(message);
      }
    };
    // Sound: Unity's own unlock listens only to mousedown/touchstart, and nothing pauses its loops in a hidden tab.
    // Track the page's audio contexts, resume them on any real gesture, suspend them while the tab is hidden.
    const audioContexts = [];
    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    if (NativeAudioContext) {
      try {
        const Tracked = class extends NativeAudioContext {
          constructor(options) { super(options); audioContexts.push(this); }
        };
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
      } catch (error) { console.warn('Audio context tracking unavailable:', error.message); }
    }
    if (navigator.audioSession) { try { navigator.audioSession.type = 'ambient'; } catch (error) {} }
    let pageHidden = document.hidden;
    function resumeAudio() {
      if (pageHidden) return;
      audioContexts.forEach(context => {
        if (context.state !== 'running' && context.state !== 'closed') context.resume().catch(() => {});
      });
    }
    function suspendAudio() {
      audioContexts.forEach(context => { if (context.state === 'running') context.suspend().catch(() => {}); });
    }
    ['pointerup', 'touchend', 'click', 'keydown'].forEach(type =>
      window.addEventListener(type, resumeAudio, {capture: true, passive: true}));
    function notifyVisibility(hidden) {
      pageHidden = hidden;
      if (hidden) suspendAudio(); else resumeAudio();
      if (window.unityInstance) window.unityInstance.SendMessage('GameRoot', 'BrowserVisibility', hidden ? '1' : '0');
    }
    document.addEventListener('visibilitychange', () => notifyVisibility(document.hidden));
    window.addEventListener('pagehide', () => notifyVisibility(true));
    window.addEventListener('pageshow', () => notifyVisibility(document.hidden));
    const loader = document.createElement('script');
    loader.src = 'Build/102c20d691096f482494e09735a1e930.loader.js';
    loader.onerror = () => showError('The game download failed. Check your connection and reload.');
    loader.onload = () => {
      createUnityInstance(canvas, config, value => {
        progress.value = value;
        percent.textContent = Math.round(value * 100) + '%';
        if (value >= 0.9) document.getElementById('load-text').textContent = '';
      }).then(instance => {
        window.unityInstance = instance;
        loading.hidden = true;
        canvas.focus({preventScroll:true});
        notifyVisibility(document.hidden);
      }).catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
