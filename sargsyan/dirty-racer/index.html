<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9e0d1">
  <meta name="description" content="Build your racing team. Upgrade your cars. Watch every race in 3D. Play Race Team Hero in your browser.">
  <title>Race Team Hero · Team Manager</title>
  <link rel="preload" as="image" href="TemplateData/loading.jpg">
  <style>
    :root { color-scheme:light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#292a28; background:#e9e0d1; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { background:#e9e0d1; }
    #shell { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); gap:8px; }
    header { width:min(100%,640px); height:32px; flex:none; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:12px; font-weight:850; letter-spacing:2px; }
    .brand span { color:#b8461b; }
    button { border:1px solid #ffffff29; border-radius:6px; background:#ffffff09; color:#292a28; font:inherit; font-size:11px; cursor:pointer; padding:6px 9px; }
    button:hover { background:#ffffff18; }
    button:focus-visible { outline:2px solid #b8461b; outline-offset:3px; }
    #play-area { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:center; }
    #game { position:relative; height:100%; aspect-ratio:6/13; max-width:100%; overflow:hidden; background:#f4efe5; box-shadow:0 16px 80px #172b4d18; border-radius:7px; }
    canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
    /* Loading art (Assets/WebGLTemplates/DirtyRacer/TemplateData/loading.jpg, baked by DR.Editor.Stage.LoadingArtBaker):
       a 1080×2340 cover scaled to fill the game box; the progress pill sits under the logo in art coordinates (--u = px per art px). */
    #loading { position:absolute; inset:0; overflow:hidden; background:#17181f; }
    #loading[hidden] { display:none; }
    #art { position:absolute; left:0; top:0; width:100%; height:100%; background:#17181f url(TemplateData/loading.jpg) center/100% 100% no-repeat; --u:.5; }
    .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    #bar { position:absolute; left:50%; top:57.9%; width:60%; transform:translateX(-50%); box-sizing:border-box; height:calc(78px * var(--u)); display:flex; align-items:center; gap:calc(18px * var(--u)); padding:0 calc(28px * var(--u)); border-radius:999px; background:rgba(18,18,24,.84); border:calc(6px * var(--u)) solid #fffdf5; box-shadow:0 calc(12px * var(--u)) calc(30px * var(--u)) rgba(0,0,0,.45); }
    progress { display:block; flex:1; min-width:0; appearance:none; -webkit-appearance:none; height:calc(24px * var(--u)); border:0; border-radius:999px; overflow:hidden; background:#3b3a44; }
    progress::-webkit-progress-bar { background:#3b3a44; border-radius:999px; }
    progress::-webkit-progress-value { background:linear-gradient(90deg,#fff27a,#ffb21c 45%,#f0461a); border-radius:999px; transition:width .15s; }
    progress::-moz-progress-bar { background:linear-gradient(90deg,#fff27a,#ffb21c 45%,#f0461a); border-radius:999px; }
    #percent { color:#fffdf5; font-weight:800; font-size:calc(38px * var(--u)); line-height:1; min-width:2.9em; text-align:right; font-variant-numeric:tabular-nums; }
    #fail { position:absolute; left:6%; right:6%; bottom:6%; display:flex; flex-direction:column; gap:12px; padding:16px; border-radius:10px; background:rgba(18,18,24,.9); color:#fffdf5; }
    #fail[hidden] { display:none; }
    #fail strong { font-size:14px; }
    #error { margin:0; font-size:12px; color:#ffb3a8; line-height:1.5; overflow-wrap:anywhere; }
    #retry { align-self:flex-start; color:#17181f; background:#ffb21c; border:0; font-weight:700; }
    #retry:hover { background:#ffc552; }
    footer { color:#6f665a; font-size:10px; text-align:center; flex:none; }
    #shell:fullscreen { background:#e9e0d1; }
    @media(max-width:480px) { #shell { gap:4px; padding-left:0; padding-right:0; } header { padding:0 12px; height:28px; } #game { border-radius:0; box-shadow:none; } footer { font-size:9px; } }
    @media(max-width:620px){#shell{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);gap:0}header{display:none}#game{border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main id="shell">
    <header><div class="brand">RACE TEAM <span>HERO</span></div><button id="fullscreen" type="button" aria-label="Toggle fullscreen">↗</button></header>
    <div id="play-area">
      <div id="game">
        <canvas id="unity-canvas" width="540" height="1170" tabindex="0" aria-label="Race Team Hero racing team game"></canvas>
        <div id="loading" role="status" aria-live="polite">
          <h1 class="sr-only">Race Team Hero</h1>
          <div id="art">
            <div id="bar"><progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress><span id="percent">0%</span></div>
          </div>
          <div id="fail" hidden><strong>Could not start the game</strong><p id="error"></p><button id="retry" type="button">Reload</button></div>
        </div>
      </div>
    </div>
  </main>
  <noscript>Enable JavaScript to play Race Team Hero.</noscript>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const game = document.getElementById('game');
    const area = document.getElementById('play-area');
    function fitGame() {
      // Portrait phones use their full safe area. Unity recomputes its UI zones and camera viewport for this aspect.
      // Keep a portrait game window on desktop/landscape; do not stretch the canvas or its backing buffer with CSS.
      const phone = window.matchMedia('(max-width:620px) and (orientation:portrait)').matches;
      const width = phone ? area.clientWidth : Math.min(area.clientWidth, area.clientHeight * 6 / 13);
      const height = phone ? area.clientHeight : width * 13 / 6;
      game.style.width = width + 'px';
      game.style.height = height + 'px';
    }
    new ResizeObserver(fitGame).observe(area);
    fitGame();
    // The loading art covers the game box like object-fit: cover; the progress pill moves and scales with it.
    const art = document.getElementById('art');
    function fitArt() {
      const w = loading.clientWidth, h = loading.clientHeight;
      if (!w || !h) return;
      const s = Math.max(w / 1080, h / 2340);
      art.style.width = 1080 * s + 'px';
      art.style.height = 2340 * s + 'px';
      art.style.left = (w - 1080 * s) / 2 + 'px';
      art.style.top = (h - 2340 * s) / 2 + 'px';
      art.style.setProperty('--u', s);
    }
    new ResizeObserver(fitArt).observe(loading);
    fitArt();
    function showError(message) {
      console.error('[Race Team Hero]', message);
      loading.hidden = false;
      document.getElementById('error').textContent = String(message);
      document.getElementById('fail').hidden = false;
    }
    document.getElementById('retry').onclick = () => location.reload();
    document.getElementById('fullscreen').onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.getElementById('shell').requestFullscreen) await document.getElementById('shell').requestFullscreen();
      } catch (error) { console.warn('Fullscreen unavailable:', error.message); }
    };
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus({preventScroll:true}));
    canvas.addEventListener('wheel', event => event.preventDefault(), {passive:false});
    const config = {
      arguments: [],
      dataUrl: 'Build/101c4772bb77f5d0f64c4c82a6d2d340.data.unityweb',
      frameworkUrl: 'Build/c393ef226495e725ceccbcd36f860e50.framework.js.unityweb',
      codeUrl: 'Build/2f8c6be09eca62ac26ea0b632fe8459a.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Race Team Hero Studio",
      productName: "Race Team Hero",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      showBanner: (message, type) => {
        if (type === 'error') showError(message);
        else console.warn(message);
      }
    };
    // Sound: Unity's own unlock listens only to mousedown/touchstart, and nothing pauses its loops in a hidden tab.
    // Track the page's audio contexts, resume them on any real gesture, suspend them while the tab is hidden.
    const audioContexts = [];
    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    if (NativeAudioContext) {
      try {
        const Tracked = class extends NativeAudioContext {
          constructor(options) { super(options); audioContexts.push(this); }
        };
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
      } catch (error) { console.warn('Audio context tracking unavailable:', error.message); }
    }
    if (navigator.audioSession) { try { navigator.audioSession.type = 'ambient'; } catch (error) {} }
    let pageHidden = document.hidden;
    function resumeAudio() {
      if (pageHidden) return;
      audioContexts.forEach(context => {
        if (context.state !== 'running' && context.state !== 'closed') context.resume().catch(() => {});
      });
    }
    function suspendAudio() {
      audioContexts.forEach(context => { if (context.state === 'running') context.suspend().catch(() => {}); });
    }
    ['pointerup', 'touchend', 'click', 'keydown'].forEach(type =>
      window.addEventListener(type, resumeAudio, {capture: true, passive: true}));
    function notifyVisibility(hidden) {
      pageHidden = hidden;
      if (hidden) suspendAudio(); else resumeAudio();
      if (window.unityInstance) window.unityInstance.SendMessage('GameRoot', 'BrowserVisibility', hidden ? '1' : '0');
    }
    document.addEventListener('visibilitychange', () => notifyVisibility(document.hidden));
    window.addEventListener('pagehide', () => notifyVisibility(true));
    window.addEventListener('pageshow', () => notifyVisibility(document.hidden));
    const loader = document.createElement('script');
    loader.src = 'Build/83ccce387d3c345b38f34652f702a8b1.loader.js';
    loader.onerror = () => showError('The game download failed. Check your connection and reload.');
    loader.onload = () => {
      createUnityInstance(canvas, config, value => {
        progress.value = value;
        percent.textContent = Math.round(value * 100) + '%';
      }).then(instance => {
        window.unityInstance = instance;
        loading.hidden = true;
        canvas.focus({preventScroll:true});
        notifyVisibility(document.hidden);
      }).catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
