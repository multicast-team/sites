<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Butcher Hero — проба стиля</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a12;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #wrap{height:calc(100vh - 56px);display:flex;justify-content:center;align-items:center}
  canvas{height:100%;max-width:100vw;aspect-ratio:200/356;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #bar{height:56px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  button{background:#2c2240;color:#fff;border:2px solid #5a4a7a;padding:8px 14px;font-size:14px;cursor:pointer}
  button.on{background:#5a3ac8;border-color:#8a6af0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="bSnow" class="on">Снег (нарисовано)</button>
  <button id="bForest">Лес (референс)</button>
</div>
<script>
const W = 200, H = 356, S = 5, OL = '#0c1220';
const out = document.getElementById('c'); out.width = W * S; out.height = H * S;
const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
let C = g;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, h = (a, b) => rnd(a * 57.1 + b * 131.7);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// ===== pixel primitives =====
function R(x, y, w, h, c) { C.fillStyle = c; C.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
function E(cx, cy, rx, ry, c) {
  C.fillStyle = c; rx = Math.max(.6, rx); ry = Math.max(.6, ry);
  for (let y = Math.ceil(cy - ry); y <= Math.floor(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy), xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    if (xb > xa) C.fillRect(xa, y, xb - xa, 1);
  }
}
function poly(pts, c) {
  C.fillStyle = c; let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.ceil(y0); y <= Math.floor(y1); y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) { const xa = Math.round(xs[k]), xb = Math.round(xs[k + 1]); if (xb > xa) C.fillRect(xa, y, xb - xa, 1); }
  }
}
const ring = (f) => { for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) f(dx, dy); };
function oE(cx, cy, rx, ry, c) { E(cx, cy, rx + 1, ry + 1, OL); E(cx, cy, rx, ry, c); }
function oPoly(pts, c) { ring((dx, dy) => poly(pts.map(p => [p[0] + dx, p[1] + dy]), OL)); poly(pts, c); }
function oR(x, y, w, h, c) { R(x - 1, y - 1, w + 2, h + 2, OL); R(x, y, w, h, c); }
function dpat(c) { const p = document.createElement('canvas'); p.width = p.height = 2; const x = p.getContext('2d'); x.fillStyle = c; x.fillRect(0, 0, 1, 1); x.fillRect(1, 1, 1, 1); return p; }
const PATS = {};
function dither(c, ctx = C) { const k = c + (ctx === g ? 'g' : 'o'); if (!PATS[k]) PATS[k] = ctx.createPattern(dpat(c), 'repeat'); return PATS[k]; }
// shaded blob: dark base + mid + light (offset to the top-left light) + dithered band between them
function blob(cx, cy, rx, ry, cols, ol = true) {
  if (ol) E(cx, cy, rx + 1, ry + 1, OL);
  E(cx, cy, rx, ry, cols[0]);
  E(cx - rx * .12, cy - ry * .14, rx * .86, ry * .82, dither(cols[1]));
  E(cx - rx * .18, cy - ry * .2, rx * .76, ry * .7, cols[1]);
  if (cols[2]) { E(cx - rx * .3, cy - ry * .34, rx * .44, ry * .36, dither(cols[2])); E(cx - rx * .34, cy - ry * .4, rx * .3, ry * .24, cols[2]); }
}
function shadow(x, y, rx, ry) { C.globalAlpha = .28; E(x, y, rx, ry, '#0a1428'); C.globalAlpha = 1; }

// ===== tiny font =====
const FD = { L:'#.... #.... #.... #.... #.... #.... #####', V:'#...# #...# #...# #...# #...# .#.#. ..#..', 0:'.###. #...# #..## #.#.# ##..# #...# .###.', 1:'..#.. .##.. ..#.. ..#.. ..#.. ..#.. .###.', 2:'.###. #...# ....# ...#. ..#.. .#... #####', 3:'####. ....# ....# .###. ....# ....# ####.', 4:'#...# #...# #...# ##### ....# ....# ....#', 5:'##### #.... ####. ....# ....# #...# .###.', 8:'.###. #...# #...# .###. #...# #...# .###.', ' ':'..... ..... ..... ..... ..... ..... .....' };
function text(str, x, y, col) { str = String(str); const w = str.length * 6 - 1; let x0 = Math.round(x - w / 2); [...str].forEach((ch, i) => { const gl = FD[ch]; if (!gl) return; gl.split(' ').forEach((row, j) => { for (let k = 0; k < 5; k++) if (row[k] === '#') { g.fillStyle = col; g.fillRect(x0 + i * 6 + k, y + j, 1, 1); } }); }); }
function lvTag(x, y, str, bg) { const w = str.length * 6 + 3; x = Math.round(x - w / 2); g.fillStyle = OL; g.fillRect(x - 1, y - 1, w + 2, 11); g.fillStyle = bg; g.fillRect(x, y, w, 9); text(str, x + w / 2 + .5, y + 1, '#fff'); }

      poly([[x, ty + 1], ...pts.slice(4).map(p => [p[0] + .5, p[1] - 1]), [x, by]], '#25595a');
      C.fillStyle = dither('#357369'); poly([[x - 1, ty + 4], [x - w * .55, by - 2], [x - w * .1, by - 3]], dither('#357369'));
      poly([[x, ty], [x - w * .55, by - 7 * s], [x - w * .2, by - 8.5 * s], [x + w * .05, by - 6 * s], [x + w * .35, by - 8 * s], [x + w * .5, by - 7.2 * s]], '#e6eef8');
      poly([[x - w * .55, by - 7 * s], [x - w * .2, by - 8.5 * s], [x - w * .2, by - 7 * s]], '#bccbe0');
      R(x - 1, ty + 1, 2, 2, '#ffffff');
    }
  },
  rock(x, y) {
    shadow(x + 1, y + 1, 9, 3);
    blob(x, y - 4, 8, 5.5, ['#4d5f80', '#6c82a4', '#93a7c4']);
    E(x - 1, y - 8.5, 6, 2.2, '#eef4fb'); E(x - 2, y - 9, 3, 1, '#ffffff');
  },
  ice(x, y) {
    shadow(x, y + 1, 8, 2.5);
    const sh = [[-5, 0, -7, -12, -2], [0, 0, 1, -17, 3], [4, 0, 6, -10, 7]];
    for (const [a, b, tx, ty, c] of sh) { oPoly([[x + a - 2, y], [x + tx, y + ty], [x + c + 1, y]], '#2a9ed8'); poly([[x + a - 1, y - 1], [x + tx, y + ty + 2], [x + (a + c) / 2, y - 1]], '#7ad8ff'); R(x + tx - .5, y + ty + 3, 1, 3, '#e8fbff'); }
    GLOW.push([x, y - 7]);
  },
  ruin(x, y) {
    shadow(x + 4, y + 2, 24, 4);
    const blocks = [[-22, -10, 14, 10], [-8, -10, 14, 10], [6, -10, 14, 10], [-15, -20, 14, 10], [-1, -20, 14, 10]];
    for (const [bx, by, bw, bh] of blocks) { oR(x + bx, y + by, bw - 1, bh - 1, '#566a8c'); R(x + bx, y + by, bw - 1, 3, '#8296b8'); R(x + bx + bw - 3, y + by + 3, 2, bh - 4, '#44577a'); R(x + bx + 2, y + by + 5, 4, 1, '#44577a'); }
    poly([[x - 16, y - 21], [x + 13, y - 21], [x + 11, y - 24], [x - 13, y - 25]], '#eef4fb'); poly([[x - 23, y - 11], [x - 15, y - 11], [x - 17, y - 13]], '#eef4fb');
  },
  tuft(x, y) { R(x - 2, y - 3, 1, 3, '#5f7ea6'); R(x, y - 4, 1, 4, '#7090b8'); R(x + 2, y - 3, 1, 3, '#5f7ea6'); R(x, y - 4, 1, 1, '#ffffff'); },
};

// ===== SNOW KNIGHT (enemy), hand drawn, animated =====
// state: 'walk' | 'idle' | 'attack' ; ph = animation phase
function drawKnight(x, y, face, state, ph) {
  const ARM = ['#4a1016', '#86202a', '#c03a3e', '#ef6b5c'], ST = ['#2e3850', '#556482', '#8a9ab8', '#d4ddeb'], GOLD = '#f0c040';
  const walk = state === 'walk', step = walk ? Math.sin(ph) : 0, bob = walk ? Math.abs(Math.cos(ph)) * 1 : Math.sin(ph * .5) * .5;
  const atk = state === 'attack' ? ph : -1; // 0..1
  const X = v => x + v * face;
  shadow(x, y, 9, 2.5);
  y = Math.round(y - bob);
  // legs (animated)
  const lA = Math.round(step * 2.5), lB = -lA;
  for (const [lx, off] of [[-4, lA], [3, lB]]) {
    const ly = y - 7 - Math.max(0, -off) * .6;
    oR(X(lx) - (face < 0 ? 2 : 0), ly, 3, 6, ST[1]); R(X(lx) - (face < 0 ? 2 : 0), ly, 1, 6, ST[2]);
    oR(X(lx + off * .4) - 1 - (face < 0 ? 1 : 0), y - 2 - Math.max(0, -off) * .6, 4, 2, ST[0]);
  }
  // cape behind
  poly([[X(-6), y - 18], [X(6), y - 18], [X(7), y - 6 + step], [X(0), y - 7], [X(-7), y - 6 - step]], OL);
  poly([[X(-5), y - 18], [X(5), y - 18], [X(6), y - 7 + step], [X(0), y - 8], [X(-6), y - 7 - step]], '#24365a');
  // body
  blob(x, y - 12, 7, 6, ARM.slice(1));
  R(x - 6, y - 9, 12, 2, '#3a2418'); R(x - 1, y - 9.5, 2, 3, GOLD);
  R(X(-1), y - 17, 2, 6, ARM[3]);
  // back arm (shield)
  oE(X(-8), y - 11, 3.5, 4.5, '#1f4f8a'); E(X(-8.6), y - 11.8, 2.2, 3, '#3a78c0'); R(X(-8) - .5, y - 13, 1, 4, GOLD);
  // pauldrons
  blob(X(-6), y - 17, 3.6, 2.8, ST.slice(1)); blob(X(6), y - 17, 3.6, 2.8, ST.slice(1));
  // helmet
  blob(x, y - 24, 6.2, 6, ST.slice(1));
  R(X(-4) - (face < 0 ? 7 : 0), y - 24, 8, 2, '#0a0e18'); R(X(1) - (face < 0 ? 1 : 0), y - 24, 2, 1, '#7ae8ff');
  oR(x - .5, y - 32, 1.5, 3, ST[2]);
  E(X(-1), y - 32, 2.4, 2, ARM[2]); R(X(-2), y - 33, 2, 1, ARM[3]);
  // sword arm (animated swing)
  let ang;
  if (atk >= 0) ang = atk < .45 ? lerp(-.4, -2.4, atk / .45) : lerp(-2.4, 1.1, clamp((atk - .45) / .2));
  else ang = -.4 + Math.sin(ph * .5) * .05 + step * .12;
  const hx = X(7), hy = y - 12;
  const bx = Math.cos(ang - Math.PI / 2) * 13 * face, by = Math.sin(ang - Math.PI / 2) * 13;
  const nx = -by / 13 * 1.4, ny = bx / 13 * 1.4;
  oPoly([[hx + nx, hy + ny], [hx + bx + nx * .5, hy + by + ny * .5], [hx + bx * 1.12, hy + by * 1.12], [hx + bx - nx * .5, hy + by - ny * .5], [hx - nx, hy - ny]], ST[2]);
  poly([[hx + nx * .3, hy + ny * .3], [hx + bx, hy + by], [hx - nx * .2, hy - ny * .2]], ST[3]);
  R(hx - 2.5, hy - 1, 5, 2, GOLD);
  blob(hx, hy + 1, 2.4, 2.2, ARM.slice(1));
  if (atk > .45 && atk < .75) { C.globalAlpha = .7; for (let k = 0; k < 8; k++) { const a = lerp(-2.4, 1.1, k / 8) - Math.PI / 2; R(hx + Math.cos(a) * 15 * face, hy + Math.sin(a) * 15, 2, 2, '#ffffff'); } C.globalAlpha = 1; }
}

// ===== DRAGON, hand drawn, animated =====
function drawDragon(x, y, t, breath) {
  const RED = ['#3e0a12', '#7a1822', '#b42a2c', '#e0503c', '#ff9a64'], BEL = ['#9a6a3c', '#d4a868', '#f2d8a4'], BONE = ['#a8987a', '#e8dcc0', '#fffaf0'];
  const flap = Math.sin(t * 5), bob = Math.round(Math.sin(t * 5 + 1) * 1.5);
  shadow(x, y + 2, 34, 6);
  y -= bob;
  // wings
  for (const sd of [-1, 1]) {
    const sh = [x + sd * 8, y - 34], tip1 = [x + sd * 34, y - 58 - flap * 9], tip2 = [x + sd * 52, y - 52 - flap * 12], tip3 = [x + sd * 50, y - 30 - flap * 7], tip4 = [x + sd * 36, y - 18 - flap * 3];
    const mem = [sh, tip1, [x + sd * 40, y - 46 - flap * 9], tip2, [x + sd * 46, y - 38 - flap * 9], tip3, [x + sd * 40, y - 26 - flap * 5], tip4, [x + sd * 22, y - 18], [x + sd * 12, y - 22]];
    oPoly(mem, '#5a1020');
    poly([sh, tip1, [x + sd * 40, y - 46 - flap * 9], tip2, [x + sd * 30, y - 34 - flap * 6], [x + sd * 14, y - 26]], '#8a1c2c');
    poly([sh, tip1, [x + sd * 26, y - 40 - flap * 4], [x + sd * 14, y - 30]], dither('#b03040'));
    for (const tp of [tip1, tip2, tip3, tip4]) { const n = 16; for (let k = 0; k <= n; k++) { const kk = k / n; R(lerp(sh[0], tp[0], kk) - 1, lerp(sh[1], tp[1], kk) - 1, 2, 2, OL); } for (let k = 0; k <= n; k++) { const kk = k / n; R(lerp(sh[0], tp[0], kk), lerp(sh[1], tp[1], kk), 1, 1, kk < .9 ? BONE[1] : BONE[2]); } }
    oPoly([[tip1[0] - 1, tip1[1]], [tip1[0] + sd * 3, tip1[1] - 5], [tip1[0] + sd * 2, tip1[1] + 1]], BONE[1]);
  }
  // tail
  const tw = Math.sin(t * 2.5) * 4;
  const tail = [[x + 10, y - 6], [x + 22, y - 2 + tw * .3], [x + 32, y - 6 + tw * .6], [x + 40, y - 14 + tw]];
  for (let i = tail.length - 1; i >= 0; i--) blob(tail[i][0], tail[i][1], 6 - i * 1.1, 4.5 - i * .8, RED.slice(1, 4));
  oPoly([[x + 39, y - 16 + tw], [x + 49, y - 22 + tw], [x + 44, y - 11 + tw]], BONE[1]);
  // hind legs
  for (const sd of [-1, 1]) { blob(x + sd * 12, y - 6, 7, 6, RED.slice(1, 4)); for (let c = -1; c <= 1; c++) { R(x + sd * 12 + c * 3 - 1, y - 1, 2, 2, OL); R(x + sd * 12 + c * 3 - .5, y - 1, 1, 1, BONE[2]); } }
  // body
  blob(x, y - 22, 17, 16, RED.slice(1, 4));
  E(x - 6, y - 30, 4, 3, dither(RED[4]));
  blob(x + 1, y - 18, 9.5, 12, BEL);
  for (let k = 0; k < 5; k++) R(x - 7 + Math.abs(k - 2), y - 26 + k * 4, 16 - Math.abs(k - 2) * 2, 1, BEL[0]);
  // spikes on the back
  for (let k = -2; k <= 2; k++) oPoly([[x + k * 6 - 2, y - 36 + Math.abs(k)], [x + k * 6, y - 42 + Math.abs(k) * 1.5], [x + k * 6 + 2, y - 36 + Math.abs(k)]], BONE[1]);
  // front arms
  for (const sd of [-1, 1]) { blob(x + sd * 15, y - 16, 4, 6, RED.slice(1, 4)); R(x + sd * 15 - 2, y - 10, 1, 2, BONE[2]); R(x + sd * 15 + 1, y - 10, 1, 2, BONE[2]); }
  // neck + head
  blob(x, y - 42, 8, 9, RED.slice(1, 4)); E(x + 1, y - 40, 4, 7, BEL[1]);
  for (const sd of [-1, 1]) oPoly([[x + sd * 6, y - 58], [x + sd * 15, y - 72], [x + sd * 13, y - 60], [x + sd * 9, y - 55]], BONE[1]);
  for (const sd of [-1, 1]) poly([[x + sd * 7, y - 58], [x + sd * 14, y - 70], [x + sd * 11, y - 59]], BONE[2]);
  blob(x, y - 56, 12, 9, RED.slice(1, 5));
  const mo = breath ? 4 : 0;
  blob(x, y - 49 + mo * .3, 9, 5.5, RED.slice(1, 4));
  R(x - 4, y - 52, 2, 1, OL); R(x + 2, y - 52, 2, 1, OL);
  if (breath) { oE(x, y - 45, 6, 3.5, '#2a0808'); E(x, y - 45, 4, 2, '#ff7a1e'); E(x, y - 45, 2, 1, '#ffe08a'); R(x - 5, y - 48, 1, 2, '#fff'); R(x + 4, y - 48, 1, 2, '#fff'); }
  else { R(x - 6, y - 46, 12, 1, RED[0]); R(x - 5, y - 46, 1, 2, '#fff'); R(x + 4, y - 46, 1, 2, '#fff'); }
  for (const sd of [-1, 1]) { R(x + sd * 6 - 2, y - 60, 4, 3, OL); R(x + sd * 6 - 1.5, y - 59.5, 3, 2, '#ffd23f'); R(x + sd * 6 - (sd < 0 ? 0 : 1), y - 60, 1, 3, OL); R(x + sd * 9 - 3, y - 63, 5, 1, RED[0]); }
  C.globalAlpha = .35; E(x - 6, y - 59, 4, 3, '#ffe060'); E(x + 6, y - 59, 4, 3, '#ffe060'); C.globalAlpha = 1;
}

// ===== scene =====
let MODE = 'snow';
const knights = [[38, 200], [160, 230], [70, 262]].map(([x, y], i) => ({ x, y, state: 'walk', ph: i, at: 0, face: x < 100 ? 1 : -1 }));
const fire = [];
let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  if (!IMG_BG.complete || !IMG_P.complete) { requestAnimationFrame(frame); return; }
  if (!snow.dataset.ok) { buildSnow(); snow.dataset.ok = 1; }
  C = g;
  g.drawImage(MODE === 'snow' ? snow : IMG_BG, 0, 0, W, H);
  if (MODE === 'snow') for (const [gx, gy] of GLOW) { g.globalAlpha = .18 + .06 * Math.sin(t * 2 + gx); E(gx, gy, 12, 9, '#5ad8ff'); g.globalAlpha = 1; }
  const px = 100, py = 300;
  // dragon breath cycle
  const cyc = t % 5, breath = cyc > 3 && cyc < 4.4;
  if (breath) for (let i = 0; i < 4; i++) fire.push({ x: 100 + (Math.random() - .5) * 4, y: 68, vx: (Math.random() - .5) * 40, vy: 70 + Math.random() * 40, t: 0 });
  for (const f of fire) { f.t += 1 / 60; f.x += f.vx / 60; f.y += f.vy / 60; }
  for (let i = fire.length - 1; i >= 0; i--) if (fire[i].t > .9) fire.splice(i, 1);
  // knights walk toward pudge, attack, respawn
  for (const k of knights) {
    if (k.state === 'walk') { const dx = px - k.x, dy = py - 14 - k.y, d = Math.hypot(dx, dy); if (d < 16) { k.state = 'attack'; k.at = 0; } else { k.x += dx / d * .45; k.y += dy / d * .45; k.ph += .16; k.face = dx > 0 ? 1 : -1; } }
    else if (k.state === 'attack') { k.at += 1 / 45; if (k.at >= 1) { k.at = 0; k.n = (k.n || 0) + 1; if (k.n > 2) { k.state = 'walk'; k.n = 0; k.y = -20; k.x = 30 + Math.random() * 140; } } }
  }
  const list = [];
  knights.forEach(k => list.push({ y: k.y, d: () => { drawKnight(k.x, k.y, k.face || 1, k.state, k.state === 'attack' ? k.at : k.ph); lvTag(k.x, k.y - 44, 'LV 15', '#c0353a'); } }));
  list.push({ y: py, d: () => { shadow(px, py, 16, 4); const b = Math.round(Math.sin(t * 3) * .7); g.drawImage(IMG_P, px - 20, py - 35 - b); g.fillStyle = OL; g.fillRect(px - 12, py - 44, 24, 5); g.fillStyle = '#43c84f'; g.fillRect(px - 11, py - 43, 18, 3); } });
  list.push({ y: 112, d: () => { drawDragon(100, 112, t, breath); lvTag(100, 30, 'LV 80', '#c0353a'); } });
  list.sort((a, b) => a.y - b.y).forEach(l => l.d());
  for (const f of fire) { const k = f.t / .9, r = 2 + k * 5; E(f.x, f.y, r, r, k < .15 ? '#fff4c0' : k < .4 ? '#ffd23f' : k < .7 ? '#ff7a1e' : '#c42a2a'); }
  if (MODE === 'snow') for (let i = 0; i < 40; i++) { const x = (rnd(i * 3.7) * W + Math.sin(t + i) * 6 + W) % W, y = (rnd(i * 5.3) * H + t * 22 * (1 + (i % 3) * .3)) % H; g.fillStyle = '#fff'; g.fillRect(Math.round(x), Math.round(y), i % 4 ? 1 : 2, i % 4 ? 1 : 2); }
  g.fillStyle = '#05080f'; for (let i = 0; i < 5; i++) { g.globalAlpha = .06; g.fillRect(0, 0, 3 + i * 3, H); g.fillRect(W - 3 - i * 3, 0, 3 + i * 3, H); } g.globalAlpha = 1;
  o.drawImage(buf, 0, 0, W * S, H * S);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const bS = document.getElementById('bSnow'), bF = document.getElementById('bForest');
bS.onclick = () => { MODE = 'snow'; bS.classList.add('on'); bF.classList.remove('on'); };
bF.onclick = () => { MODE = 'forest'; bF.classList.add('on'); bS.classList.remove('on'); };
</script>
