<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Butcher Hero — проба стиля v3</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a12;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #wrap{height:calc(100vh - 96px);display:flex;justify-content:center;align-items:center}
  canvas{height:100%;max-width:100vw;aspect-ratio:200/356;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  .bar{height:48px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  button{background:#2c2240;color:#fff;border:2px solid #5a4a7a;padding:6px 12px;font-size:13px;cursor:pointer}
  button.on{background:#5a3ac8;border-color:#8a6af0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="bar" id="locs"></div>
<div class="bar" id="scenes"></div>
<script>
const W = 200, H = 356, S = 5, OL = '#0c1220';
const out = document.getElementById('c'); out.width = W * S; out.height = H * S;
const o = out.getContext('2d'); o.imageSmoothingEnabled = false;
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;
let C = g;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, h = (a, b) => rnd(a * 57.1 + b * 131.7);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// ===== pixel primitives =====
function R(x, y, w, h, c) { C.fillStyle = c; C.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
function E(cx, cy, rx, ry, c) {
  C.fillStyle = c; rx = Math.max(.6, rx); ry = Math.max(.6, ry);
  for (let y = Math.ceil(cy - ry); y <= Math.floor(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy), xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    if (xb > xa) C.fillRect(xa, y, xb - xa, 1);
  }
}
function poly(pts, c) {
  C.fillStyle = c; let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.ceil(y0); y <= Math.floor(y1); y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) { const xa = Math.round(xs[k]), xb = Math.round(xs[k + 1]); if (xb > xa) C.fillRect(xa, y, xb - xa, 1); }
  }
}
const ring4 = f => { for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) f(dx, dy); };
function oE(cx, cy, rx, ry, c) { E(cx, cy, rx + 1, ry + 1, OL); E(cx, cy, rx, ry, c); }
function oPoly(pts, c) { ring4((dx, dy) => poly(pts.map(p => [p[0] + dx, p[1] + dy]), OL)); poly(pts, c); }
function oR(x, y, w, h, c) { R(x - 1, y - 1, w + 2, h + 2, OL); R(x, y, w, h, c); }
function line(x0, y0, x1, y1, c, w = 1) { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0))); for (let i = 0; i <= n; i++) R(lerp(x0, x1, i / n) - (w - 1) / 2, lerp(y0, y1, i / n) - (w - 1) / 2, w, w, c); }
function oline(x0, y0, x1, y1, c, w = 1) { line(x0, y0, x1, y1, OL, w + 2); line(x0, y0, x1, y1, c, w); }
const PATS = {};
function dither(c) { const k = c + (C === g ? 'g' : C.canvas.width + 'x'); if (!PATS[k]) { const p = document.createElement('canvas'); p.width = p.height = 2; const x = p.getContext('2d'); x.fillStyle = c; x.fillRect(0, 0, 1, 1); x.fillRect(1, 1, 1, 1); PATS[k] = C.createPattern(p, 'repeat'); } return PATS[k]; }
// shaded blob, light from top-left: base(shadow) / mid / light + dithered transitions
function blob(cx, cy, rx, ry, cols, ol = true) {
  if (ol) E(cx, cy, rx + 1, ry + 1, OL);
  E(cx, cy, rx, ry, cols[0]);
  E(cx - rx * .1, cy - ry * .12, rx * .88, ry * .84, dither(cols[1]));
  E(cx - rx * .16, cy - ry * .2, rx * .78, ry * .72, cols[1]);
  if (cols[2]) { E(cx - rx * .28, cy - ry * .34, rx * .46, ry * .38, dither(cols[2])); E(cx - rx * .32, cy - ry * .4, rx * .32, ry * .26, cols[2]); }
}
function shadow(x, y, rx, ry) { C.globalAlpha = .3; E(x, y, rx, ry, '#06101e'); C.globalAlpha = 1; }
function glow(x, y, r, c, a) { C.globalAlpha = a; E(x, y, r, r * .75, c); C.globalAlpha = a * .8; E(x, y, r * .55, r * .42, c); C.globalAlpha = 1; }

  0:'.###. #...# #..## #.#.# ##..# #...# .###.', 1:'..#.. .##.. ..#.. ..#.. ..#.. ..#.. .###.',
  2:'.###. #...# ....# ...#. ..#.. .#... #####', 3:'####. ....# ....# .###. ....# ....# ####.',
  4:'#...# #...# #...# ##### ....# ....# ....#', 5:'##### #.... ####. ....# ....# #...# .###.',

  8:'.###. #...# #...# .###. #...# #...# .###.', 9:'.###. #...# #...# .#### ....# ....# .###.',
  '!':'..#.. ..#.. ..#.. ..#.. ..#.. ..... ..#..', '+':'..... ..#.. ..#.. ##### ..#.. ..#.. .....',
  '?':'.###. #...# ....# ...#. ..#.. ..... ..#..', '.':'..... ..... ..... ..... ..... ..... ..#..',
  '-':'..... ..... ..... ##### ..... ..... .....', ':':'..... ..#.. ..... ..... ..... ..#.. .....',
  '/':'....# ...#. ...#. ..#.. .#... .#... #....', ',':'..... ..... ..... ..... ..... ..#.. .#...'};

const FONT = {}; for (const k in FD) FONT[k] = FD[k].split(' ');
function text(str, x, y, col = '#fff', outline = OL) {
  str = String(str).toUpperCase(); const w = str.length * 6 - 1, x0 = Math.round(x - w / 2);
  const pass = (c, gr) => { g.fillStyle = c; [...str].forEach((ch, i) => { const gl = FONT[ch]; if (!gl) return; gl.forEach((row, j) => { for (let k = 0; k < 5; k++) if (row[k] === '#') g.fillRect(x0 + i * 6 + k - gr, y + j - gr, 1 + gr * 2, 1 + gr * 2); }); }); };
  if (outline) pass(outline, 1); pass(col, 0);
}
function tag(x, y, str, bg) { const w = str.length * 6 + 3; x = Math.round(x - w / 2); g.fillStyle = OL; g.fillRect(x - 1, y - 1, w + 2, 11); g.fillStyle = bg; g.fillRect(x, y, w, 9); text(str, x + w / 2 + .5, y + 1, '#fff', null); }
