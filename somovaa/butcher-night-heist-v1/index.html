<!DOCTYPE html>
<html lang="ru">
<head>

<style>

<script>
// ===== Setup =====
const W = 270, H = 480, S = 4, WH = 2000, OL = '#1a1020', DT = 1 / 120;
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d'); g.imageSmoothingEnabled = false;

const tg = tmp.getContext('2d'); tg.imageSmoothingEnabled = false;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

// ===== Pixel primitives (draw into ctx C) =====
let C = g;
function R(x, y, w, h, c) {
  C.fillStyle = c; C.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}
function E(cx, cy, rx, ry, c) {
  C.fillStyle = c; rx = Math.max(.6, rx); ry = Math.max(.6, ry);
  for (let y = Math.ceil(cy - ry); y <= Math.floor(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy), xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    if (xb > xa) C.fillRect(xa, y, xb - xa, 1);

}
function oE(cx, cy, rx, ry, c) { E(cx, cy, rx + 1, ry + 1, OL); E(cx, cy, rx, ry, c); }
function oR(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y); w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  C.fillStyle = OL; C.fillRect(x - 1, y - 1, w + 2, h + 2); C.fillStyle = c; C.fillRect(x, y, w, h);
}
function poly(pts, c) {
  C.fillStyle = c; let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.ceil(y0); y <= Math.floor(y1); y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) { const xa = Math.round(xs[k]), xb = Math.round(xs[k + 1]); if (xb > xa) C.fillRect(xa, y, xb - xa, 1); }
  }
}
function oPoly(pts, c) { for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) poly(pts.map(p => [p[0] + dx, p[1] + dy]), OL); poly(pts, c); }
// local rig: coordinates in "unit pixels", scaled by s and mirrored by facing f
function rig(x, y, sx, sy, f) {
  const X = v => x + v * f * sx, Y = v => y + v * sy;
  return {
    e: (cx, cy, rx, ry, c, ol = 1) => (ol ? oE : E)(X(cx), Y(cy), rx * sx, ry * sy, c),
    r: (x0, y0, w, h, c, ol = 1) => (ol ? oR : R)(f > 0 ? X(x0) : X(x0 + w), Y(y0), w * sx, h * sy, c),
    p: (pts, c, ol = 1) => (ol ? oPoly : poly)(pts.map(q => [X(q[0]), Y(q[1])]), c),

}
function shadow(x, y, rx, ry) { C.globalAlpha = .25; E(x, y, rx, ry, '#000'); C.globalAlpha = 1; }
function dither(c) {

  return g.createPattern(p, 'repeat');
}
const DY = dither('#fff2a0'), DP = dither('#7a4ab8'), DW = dither('#ffffff');

// ===== Small sprites =====
const PAL = { K: OL, Y: '#ffd23f', y: '#c99a16', W: '#fff', w: '#d8d0c0', R: '#d8322f', S: '#c4ced8', s: '#8a96a4', k: '#000' };
function makeSpr(rows) {
  const c = document.createElement('canvas'); c.width = Math.max(...rows.map(r => r.length)); c.height = rows.length;

  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } }));

}
const SPR = {

// ===== Bitmap font 5x7 =====
const FD = {
  A:'.###. #...# #...# ##### #...# #...# #...#', B:'####. #...# #...# ####. #...# #...# ####.',
  C:'.#### #.... #.... #.... #.... #.... .####', D:'####. #...# #...# #...# #...# #...# ####.',

  I:'##### ..#.. ..#.. ..#.. ..#.. ..#.. #####', J:'..### ...#. ...#. ...#. ...#. #..#. .##..',

  S:'.#### #.... #.... .###. ....# ....# ####.', T:'##### ..#.. ..#.. ..#.. ..#.. ..#.. ..#..',

  W:'#...# #...# #...# #.#.# #.#.# ##.## #...#', X:'#...# #...# .#.#. ..#.. .#.#. #...# #...#',
  Y:'#...# #...# .#.#. ..#.. ..#.. ..#.. ..#..', Z:'##### ....# ...#. ..#.. .#... #.... #####',

  4:'#...# #...# #...# ##### ....# ....# ....#', 5:'##### #.... ####. ....# ....# #...# .###.',
  6:'.###. #.... #.... ####. #...# #...# .###.', 7:'##### ....# ...#. ..#.. .#... .#... .#...',
  8:'.###. #...# #...# .###. #...# #...# .###.', 9:'.###. #...# #...# .#### ....# ....# .###.',
  '!':'..#.. ..#.. ..#.. ..#.. ..#.. ..... ..#..', '+':'..... ..#.. ..#.. ##### ..#.. ..#.. .....',
  '?':'.###. #...# ....# ...#. ..#.. ..... ..#..', '.':'..... ..... ..... ..... ..... ..... ..#..',
  '-':'..... ..... ..... ##### ..... ..... .....', ':':'..... ..#.. ..... ..... ..... ..#.. .....',
  '/':'....# ...#. ...#. ..#.. .#... .#... #....', ',':'..... ..... ..... ..... ..... ..#.. .#...'};
const FONT = {}; for (const k in FD) FONT[k] = FD[k].split(' ');
function text(str, x, y, sc = 1, col = '#fff', align = 'center', outline = OL, col2 = null, shadowOff = 0) {
  str = String(str).toUpperCase();
  const w = str.length * 6 * sc - sc;
  const x0 = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x); y = Math.round(y);
  const pass = (c, c2, grow, dy) => {
    [...str].forEach((ch, i) => {
      const gl = FONT[ch]; if (!gl) return;
      gl.forEach((row, j) => {
        g.fillStyle = c2 && j >= 4 ? c2 : c;
        for (let k = 0; k < 5; k++) if (row[k] === '#') g.fillRect(x0 + i * 6 * sc + k * sc - grow, y + j * sc - grow + dy, sc + grow * 2, sc + grow * 2);
      });
    });
  };
  const grow = sc >= 3 ? 2 : 1;
  if (outline && shadowOff) pass(outline, null, grow, shadowOff);
  if (outline) pass(outline, null, grow, 0);

}
function bigText(str, x, y, sc, c1 = '#ffe14a', c2 = '#f0a020') { text(str, x, y, sc, c1, 'center', OL, c2, Math.ceil(sc / 2) + 1); }
function lvTag(x, y, str, bg) {
  const w = str.length * 6 + 5; x = Math.round(x - w / 2); y = Math.round(y);
  g.fillStyle = OL; g.fillRect(x - 1, y - 1, w + 2, 13);
  g.fillStyle = bg; g.fillRect(x, y, w, 11);
  g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(x, y, w, 1);
  text(str, x + 3, y + 2, 1, '#fff', 'left', null);
}
function bubble(x, y, str) {
  const w = str.length * 6 + 9; x = Math.round(x - w / 2); y = Math.round(y);
  g.fillStyle = OL; g.fillRect(x - 1, y - 1, w + 2, 17); g.fillRect(x + w / 2 - 4, y + 15, 9, 3); g.fillRect(x + w / 2 - 2, y + 18, 5, 2);
  g.fillStyle = '#fff'; g.fillRect(x, y, w, 15); g.fillRect(x + w / 2 - 3, y + 15, 7, 2); g.fillRect(x + w / 2 - 1, y + 17, 3, 2);

// ===== Audio =====
let AC = null, master = null, recDest = null, SILENT = false;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination);
  recDest = AC.createMediaStreamDestination(); master.connect(recDest);
}
function tone(f, dur, type = 'square', vol = .2, slide = 0, delay = 0) {
  if (!AC || SILENT) return;
  const t0 = AC.currentTime + delay, os = AC.createOscillator(), ga = AC.createGain();
  os.type = type; os.frequency.setValueAtTime(f, t0);
  if (slide) os.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t0 + dur);
  ga.gain.setValueAtTime(vol, t0); ga.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  os.connect(ga).connect(master); os.start(t0); os.stop(t0 + dur + .02);
}
function noise(dur, vol = .3, freq = 800) {
  if (!AC || SILENT) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), ga = AC.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq;
  ga.gain.setValueAtTime(vol, AC.currentTime); ga.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  s.connect(f).connect(ga).connect(master); s.start();
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SFX = {
  kick() { noise(.25, .7, 300); tone(160, .35, 'square', .45, -120); },
  thud() { noise(.35, .7, 150); tone(90, .4, 'sine', .6, -50); },
  hook() { tone(1300, .1, 'sawtooth', .08, -800); },
  chomp() { noise(.09, .5, 1800); tone(150, .14, 'square', .3, -90); },
  coin() { tone(988, .05, 'square', .1); tone(1319, .12, 'square', .1, 0, .05); },
  lvl() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .16, 0, i * .06)); },
  laugh() { [440, 370, 440, 370, 440].forEach((f, i) => tone(f, .09, 'square', .13, -60, i * .11)); },
  whoosh() { noise(.6, .35, 2400); },
  miss() { tone(2000, .04, 'square', .05, -1000); },
  alert() { tone(880, .1, 'square', .2); tone(1175, .2, 'square', .2, 0, .1); },
  boom() { noise(.6, .8, 200); tone(70, .7, 'sawtooth', .35, -30); },
  roar() { noise(1.1, .8, 260); tone(140, 1.1, 'sawtooth', .35, -80); tone(70, 1.1, 'square', .2, -30); },
  fire() { noise(.9, .45, 1200); },
  evo() { noise(.5, .4, 3000); tone(220, .6, 'sawtooth', .2, 660); tone(1568, .3, 'square', .1, 0, .45); },
  steal() { tone(700, .1, 'square', .14, -400); tone(330, .2, 'square', .12, -150, .08); },
  slash() { noise(.35, .6, 1800); tone(900, .3, 'sawtooth', .15, -700); },
  clang() { tone(1800, .25, 'square', .15, -600); noise(.15, .5, 4000); },
  fanfare() { [[523, 0], [659, .12], [784, .24], [1047, .36], [784, .52], [1047, .64]].forEach(([f, d]) => tone(f, .22, 'square', .16, 0, d)); }
};
const BASS = [36, 36, 48, 36, 36, 48, 36, 48, 39, 39, 51, 39, 41, 41, 53, 41];
const ARP = [60, 63, 67, 72, 67, 63, 60, 67, 63, 67, 70, 75, 65, 69, 72, 77];
function music(step) {
  const i = step % 16, ph = SIM.phase;
  if (ph === 'intro' || ph === 'heist') { if (SIM.t < (ph === 'heist' ? 4.05 : 1.3) && i % 2 === 0) tone(midi([40, 43, 45, 43][(i / 2) % 4] + 12), .08, 'triangle', .2); return; }
  if (ph === 'fly' || ph === 'land') { if (i % 8 === 0) tone(midi(36), .5, 'sawtooth', .06); return; }
  if (ph === 'hunt') {
    if (i % 4 === 0) tone(150, .12, 'sine', .45, -110);
    if (i % 4 === 2) noise(.05, .1, 6000);
    tone(midi(BASS[i]), .09, 'square', .07);
    if (i % 2 === 0) tone(midi(ARP[i]), .08, 'square', .05);
    return;
  }
  if (ph === 'final') { if (!SIM.bossDead && i % 2 === 0) noise(.04, .12, 400); return; }
  if (i % 2 === 0) tone(midi(ARP[(i + 4) % 16] + 12), .1, 'triangle', .09);

// ===== Scenario =====
const SCN = window.SCN || 'dragon';

// ===== World (pre-rendered ground, 5 locations) =====
const GATES = [380, 700, 1060, 1420];
const Z0 = {
  dragon: { name: 'DRAGON LAIR', g: ['#2e2630', '#3a3040', '#463a4c'], mortar: '#1c1622' },
  knight: { name: 'BLACK FORTRESS', g: ['#6a5a50', '#76655a', '#827064'], mortar: '#3e322c' },
  heist: { name: 'ROYAL CASTLE', g: ['#8a8478', '#989286', '#a6a094'], mortar: '#5f5a50' } }[SCN];
const ZONES = [Z0,
  { name: 'VOLCANO', g: ['#3a3032', '#463a3a', '#544644'], d: ['#5c5250', '#6a605c', '#787068'] },
  { name: 'FROST LANDS', g: ['#9cb0cc', '#b2c4dc', '#c8d6ec'], d: ['#7c90b0', '#8a9ebe', '#98acca'] },

  { name: 'DARK FOREST', g: ['#1b3344', '#213c4e', '#284858'], d: ['#162636', '#1a2c3e', '#203446'] }];

const pathX = y => 135 + 45 * Math.sin(y / 170) + 18 * Math.sin(y / 61);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, h = (a, b) => rnd(a * 57.1 + b * 131.7);

const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const world = document.createElement('canvas'); world.width = W; world.height = WH;
const MUSH = [];

const LAND = { x: 135, y: 1880 };
function buildWorld() {
  const wc = world.getContext('2d'), img = wc.createImageData(W, WH), d = img.data;

        else if (lx < 10) c = hex('#5a1a0a');

      if (zi === 2 && rnd(x * 3.1 + y * 5.7) > .992) c = hex('#ffffff');
      if (zi === 4 && rnd(x * 5.1 + y * 2.3) > .99) c = hex('#2f5a6c');
    }
    const i = (y * W + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  wc.putImageData(img, 0, 0);
  C = wc;

  recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12e6 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'butcher_hero_pixel.' + (mimeType.includes('mp4') ? 'mp4' : 'webm'); a.click();
    btn.classList.remove('on'); btn.textContent = '⏺ Скачать видео 1080×1920';
  };
  btn.classList.add('on'); btn.textContent = '● Идёт запись…';
  restart(); paused = false; recorder.start();
};
</script>
</body>
