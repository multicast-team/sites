<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Word Harvest</title>
    <style>
      /* a portrait frame like the web version's (390 × 844): as tall as the window on a computer, the whole screen on a phone */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d1630; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #231F20; }
      #loading { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
        font: 600 18px system-ui, sans-serif; color: #e9e4f2; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Загрузка… 0%</div>
    <script src="Build/webgl5.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      function fit() {
        var w = window.innerWidth, h = window.innerHeight, k = 390 / 844;
        if (phone) { canvas.style.width = w + "px"; canvas.style.height = h + "px"; return; }
        var cw = Math.min(w, h * k);
        canvas.style.width = Math.floor(cw) + "px";
        canvas.style.height = Math.floor(cw / k) + "px";
      }
      fit();
      window.addEventListener("resize", fit);
      var loading = document.querySelector("#loading");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/webgl5.data.unityweb",
        frameworkUrl: "Build/webgl5.framework.js.unityweb",
        codeUrl: "Build/webgl5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Multicast Games",
        productName: "Word Harvest",
        productVersion: "0.1.0",
      }, function (progress) {
        loading.textContent = "Загрузка… " + Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
      }).catch(function (message) {
        loading.textContent = message;
      });
    </script>
  </body>
</html>
