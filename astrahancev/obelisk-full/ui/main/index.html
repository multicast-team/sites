<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Obelisk Full — порт 2.2.50 (локально)</title>
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 13px sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; }
  #game { touch-action: none; image-rendering: pixelated; background: #000; }
  #bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  #bar button, #bar select { font: inherit; }
  #status { min-height: 1.2em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <select id="pack"><option value="gray">skin-gray</option><option value="local">skin-local</option></select>
    <select id="size"><option value="500">500×960</option><option value="1000">1000×1920</option></select>
    <button id="new">Новая игра</button>
    <button id="save">Сохранить</button>
    <button id="load">Загрузить</button>
    <button id="export">Экспорт сейва</button>
    <label><input id="import" type="file" accept=".ini,.txt,.dat"> Импорт</label>
  </div>
  <canvas id="game" width="500" height="960"></canvas>
  <div id="status">загрузка…</div>
</div>
<script type="module" src="./boot.mjs"></script>
</body>
</html>
