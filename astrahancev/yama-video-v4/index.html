<header><h1>Одна Яма — геймплей, версия v4</h1>
<div class="sub">Мобильная arcade-idle по мотивам P.I.T.T. Играет бот-новичок (как неопытный игрок), запись 29.10.2026.</div></header>
<main>
<figure><video controls playsinline preload="metadata" poster="start.png" src="start.mp4"></video>
<figcaption><h2>1. Старт <span class="len">2:30</span></h2>
<p>Первые 2,5 минуты главы I: герой собирает первых уток руками на сборщике, несёт их к Яме, получает первые монеты и комбо, открывает «Прокачки» (Руки, Стопка). Мотор и пушка — следующая цель на плашке «Дальше».</p></figcaption></figure>
<figure><video controls playsinline preload="metadata" poster="norm.png" src="norm.mp4"></video>
<figcaption><h2>2. Норма <span class="len">1:40</span></h2>
<p>Три куска подряд (склейка): кнопка «Начать норму» и ход нормы, плашка ролика «Норма ×2 · 2 мин», сдача нормы 2 100 уток, эволюция Ямы и переход в главу II. Минуты ожидания между кусками вырезаны.</p></figcaption></figure>
<figure><video controls playsinline preload="metadata" poster="gym.png" src="gym.mp4"></video>
<figcaption><h2>3. Спортзал <span class="len">1:02</span></h2>
<p>Первая минута главы II: открывается Спортзал, первая линия, прокачки и новые заказы.</p></figcaption></figure>
</main>
