<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Traffic Flow 3D (прототип)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <!-- TF-PORTRAIT -->
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#151923; }
#unity-container, #unity-container.unity-mobile, #unity-container.unity-desktop {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
}
#unity-canvas { display:block; width:100% !important; height:100% !important; }
#unity-fullscreen-container { width:100% !important; height:100% !important; }
#unity-footer { display:none; }
#unity-loading-container { position:absolute; inset:0; background:#BFE3F5; color:#24364B; }
#unity-loading-bar { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:82%; max-width:360px; text-align:center; font-family:system-ui,sans-serif; }
#unity-logo { width:auto; height:auto; background:none; margin:0 0 32px; }
#unity-logo strong { display:block; font-size:clamp(28px,6vw,44px); letter-spacing:-1px; line-height:1.05; }
#unity-logo span { display:block; margin-top:12px; font-size:14px; }
#unity-progress-bar-empty { width:100%; height:10px; margin:0; border-radius:8px; overflow:hidden; background:#99BFD3; }
#unity-progress-bar-full { width:0; height:100%; margin:0; border-radius:8px; background:#276CB3; }
#tf-load-status { font-size:14px; min-height:40px; margin:16px 0 0; }
#tf-load-retry { display:inline-block; margin-top:16px; color:#24364B; padding:10px 24px; background:white; border-radius:12px; }
#tf-load-retry[hidden] { display:none; }
#unity-warning { max-height:40%; overflow:auto; font:13px system-ui,sans-serif; }
</style>
<script>
window.__tfLoadStats = { startedAt:performance.now(), progress:0 };
window.__tfLoading = function(progress, failed) {
  var ru = (new URLSearchParams(location.search).get('lang') || navigator.language || 'ru').toLowerCase().startsWith('ru');
  var status = document.getElementById('tf-load-status');
  var fill = document.getElementById('unity-progress-bar-full');
  var retry = document.getElementById('tf-load-retry');
  if (!status || !fill || !retry) return;
  if (failed) {
    document.getElementById('unity-loading-container').style.display = 'block';
    status.textContent = ru ? 'Не удалось загрузить игру. Проверьте соединение и попробуйте ещё раз.' : 'The game could not load. Check your connection and try again.';
    retry.textContent = ru ? 'Повторить' : 'Try again';
    retry.hidden = false;
    window.__tfLoadStats.failed = true;
    return;
  }
  var p = Math.max(window.__tfLoadStats.progress, Math.min(1, Math.max(0, Number(progress) || 0)));
  window.__tfLoadStats.progress = p;
  fill.style.width = (p * 100) + '%';
  status.textContent = p >= .9 ? (ru ? 'Подготавливаем город…' : 'Preparing the city…') : (ru ? 'Загружаем игру…' : 'Loading the game…');
};
window.addEventListener('load', function () {
  var box = document.getElementById('unity-container');
  var canvas = document.getElementById('unity-canvas');
  var fit = function () {
    var h = Math.min(window.innerHeight, window.innerWidth * 2340 / 1080);
    box.style.width = Math.round(h * 1080 / 2340) + 'px';
    box.style.height = Math.round(h) + 'px';
    // Опорный буфер 1080×2340, бюджет пикселей как в шаблоне GloryHoles.
    var scale = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt((720 * 1560) / Math.max(1, box.clientWidth * box.clientHeight)));
    canvas.width = Math.max(1, Math.floor(box.clientWidth * scale));
    canvas.height = Math.max(1, Math.floor(box.clientHeight * scale));
  };
  window.__tfFitCanvas = fit;
  fit(); window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  window.__tfLoading(window.__tfLoadStats.progress);
});
</script>
<!-- /TF-PORTRAIT -->
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="540" height="1170" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"><strong>TRAFFIC<br>FLOW</strong><span>3D</span></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
<!-- TF-LOAD-TEXT --><p id="tf-load-status" role="status" aria-live="polite"></p><a id="tf-load-retry" href="" hidden>Повторить</a><!-- /TF-LOAD-TEXT -->
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Traffic Flow 3D</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ftue1r1_web.loader.js?v=ftue1r1";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ftue1r1_web.data.unityweb?v=ftue1r1",
        frameworkUrl: buildUrl + "/ftue1r1_web.framework.js.unityweb?v=ftue1r1",
        codeUrl: buildUrl + "/ftue1r1_web.wasm.unityweb?v=ftue1r1",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "TF3D",
        productName: "Traffic Flow 3D",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "540px";
        fullscreenContainer.style.height = "1170px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = () => { console.error('[TF] Не загружен Unity loader'); window.__tfLoading(0, true); };
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => { window.__tfLoading(progress); }).then((unityInstance) => {
          window.__tfFitCanvas && window.__tfFitCanvas();
          window.__tfLoadStats.completedAt = performance.now();
          document.getElementById('unity-loading-container').style.display = 'none';
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                console.error(message); window.__tfLoading(0, true);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
